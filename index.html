<title>Bijneshwor Job Search</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root {
    --ink: #1b1f23;
    --ink-soft: #4a5158;
    --paper: #eeede7;
    --surface: #ffffff;
    --surface-2: #f6f5f1;
    --line: #dcdad2;
    --accent: #3b5ba5;
    --accent-soft: #e7ecf7;
    --good: #2f6f4e;
    --good-soft: #e4efe8;
    --warn: #a8710a;
    --warn-soft: #f6ecd9;
    --muted: #6b7280;
    --muted-soft: #eceef0;
    --skip: #9a3b3b;
    --skip-soft: #f5e6e6;
    --focus: #3b5ba5;
    --shadow: 0 1px 2px rgba(27,31,35,0.04), 0 1px 8px rgba(27,31,35,0.03);
    --shadow-hover: 0 2px 4px rgba(27,31,35,0.06), 0 6px 16px rgba(27,31,35,0.06);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ink: #ecebe7;
      --ink-soft: #b7bcc2;
      --paper: #14171a;
      --surface: #1c2024;
      --surface-2: #20242a;
      --line: #33383e;
      --accent: #8fa9e0;
      --accent-soft: #232b3d;
      --good: #7fbf9c;
      --good-soft: #1d2f26;
      --warn: #e3ab52;
      --warn-soft: #332912;
      --muted: #9aa3ab;
      --muted-soft: #262a2e;
      --skip: #d98080;
      --skip-soft: #332222;
      --shadow: 0 1px 2px rgba(0,0,0,0.2), 0 1px 8px rgba(0,0,0,0.16);
      --shadow-hover: 0 2px 4px rgba(0,0,0,0.24), 0 6px 20px rgba(0,0,0,0.22);
    }
  }
  :root[data-theme="dark"] {
    --ink: #ecebe7;
    --ink-soft: #b7bcc2;
    --paper: #14171a;
    --surface: #1c2024;
    --surface-2: #20242a;
    --line: #33383e;
    --accent: #8fa9e0;
    --accent-soft: #232b3d;
    --good: #7fbf9c;
    --good-soft: #1d2f26;
    --warn: #e3ab52;
    --warn-soft: #332912;
    --muted: #9aa3ab;
    --muted-soft: #262a2e;
    --skip: #d98080;
    --skip-soft: #332222;
    --shadow: 0 1px 2px rgba(0,0,0,0.2), 0 1px 8px rgba(0,0,0,0.16);
    --shadow-hover: 0 2px 4px rgba(0,0,0,0.24), 0 6px 20px rgba(0,0,0,0.22);
  }

  * { box-sizing: border-box; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'IBM Plex Sans', system-ui, sans-serif;
    font-size: 15px;
    line-height: 1.5;
    padding-inline: 16px;
    padding-block: 24px;
  }
  .mono { font-family: 'IBM Plex Mono', ui-monospace, monospace; }
  .tabular { font-variant-numeric: tabular-nums; }

  .wrap {
    max-width: 1160px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 260px 1fr;
    gap: 28px;
  }
  @media (max-width: 760px) {
    .wrap { grid-template-columns: 1fr; }
  }

  header.top {
    grid-column: 1 / -1;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    flex-wrap: wrap;
    gap: 12px;
    border-bottom: 2px solid var(--ink);
    padding-bottom: 14px;
    margin-bottom: 4px;
  }
  header.top .name {
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 4px;
  }
  header.top h1 {
    margin: 0;
    font-size: 26px;
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  header.top .meta {
    font-size: 12px;
    color: var(--muted);
    text-align: right;
  }

  /* Stats bar */
  .stats-bar {
    grid-column: 1 / -1;
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 10px;
  }
  @media (max-width: 760px) {
    .stats-bar { grid-template-columns: repeat(3, 1fr); }
  }
  .stat-tile {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px 14px;
    cursor: pointer;
    text-align: left;
    font-family: inherit;
    box-shadow: var(--shadow);
    transition: box-shadow 0.12s ease, transform 0.12s ease, border-color 0.12s ease;
  }
  .stat-tile:hover { box-shadow: var(--shadow-hover); transform: translateY(-1px); }
  .stat-tile.active { border-color: var(--accent); box-shadow: 0 0 0 1.5px var(--accent) inset; }
  .stat-tile .n {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 22px;
    font-weight: 600;
    line-height: 1.1;
  }
  .stat-tile .l {
    font-size: 11px;
    color: var(--muted);
    margin-top: 3px;
    letter-spacing: 0.02em;
  }
  .stat-tile.c-good .n { color: var(--good); }
  .stat-tile.c-warn .n { color: var(--warn); }
  .stat-tile.c-muted .n { color: var(--muted); }
  .stat-tile.c-skip .n { color: var(--skip); }
  .stat-tile.c-accent .n { color: var(--accent); }

  /* Controls */
  .controls {
    grid-column: 1 / -1;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .controls input[type="search"] {
    flex: 1;
    min-width: 180px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 9px 12px;
    font-family: inherit;
    font-size: 13.5px;
    color: var(--ink);
  }
  .controls input[type="search"]::placeholder { color: var(--muted); }
  .controls select {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 9px 10px;
    font-family: inherit;
    font-size: 13px;
    color: var(--ink);
  }
  .controls .result-count {
    font-size: 12px;
    color: var(--muted);
    white-space: nowrap;
  }

  /* Sidebar */
  aside {
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  .panel {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 14px 16px;
    box-shadow: var(--shadow);
  }
  .panel h2 {
    font-size: 11px;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 10px;
    font-weight: 600;
  }
  .track-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 8px;
    padding: 6px 0;
    border-bottom: 1px solid var(--line);
    font-size: 13px;
  }
  /* Sidebar nav */
  .nav-panel { display: flex; flex-direction: column; gap: 4px; }
  .nav-link {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 9px 12px;
    border-radius: 8px;
    font-size: 13.5px;
    font-weight: 500;
    color: var(--ink-soft);
    background: transparent;
    border: 1px solid transparent;
    cursor: pointer;
    text-align: left;
    font-family: inherit;
  }
  .nav-link:hover { background: var(--surface-2); }
  .nav-link.active {
    background: var(--accent-soft);
    color: var(--accent);
    font-weight: 600;
  }
  .nav-link .nav-count {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: inherit;
    opacity: 0.75;
  }

  .track-row:last-child { border-bottom: none; }
  .track-row .tier-pill {
    flex-shrink: 0;
    font-size: 10px;
    padding: 1px 7px;
    border-radius: 99px;
    font-weight: 600;
  }
  .tier-pill.t1 { background: var(--good-soft); color: var(--good); }
  .tier-pill.t2 { background: var(--warn-soft); color: var(--warn); }
  .tier-pill.t3 { background: var(--muted-soft); color: var(--muted); }

  .company-row {
    padding: 8px 0;
    border-bottom: 1px solid var(--line);
  }
  .company-row:last-child { border-bottom: none; }
  .company-row .cname { font-weight: 600; font-size: 13px; }
  .company-row .cmeta { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
  .company-row a { color: var(--accent); text-decoration: none; }
  .company-row a:hover { text-decoration: underline; }
  .status-dot {
    display: inline-block;
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--good);
    margin-right: 6px;
    vertical-align: middle;
  }

  .rule-box {
    font-size: 12.5px;
    color: var(--ink-soft);
    border-left: 3px solid var(--accent);
    padding-left: 10px;
  }

  /* Main */
  main { display: flex; flex-direction: column; gap: 14px; min-width: 0; }

  details.tier-section {
    background: transparent;
  }
  details.tier-section > summary {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 15px;
    font-weight: 600;
    margin: 0 0 10px;
    cursor: pointer;
    list-style: none;
    user-select: none;
  }
  details.tier-section > summary::-webkit-details-marker { display: none; }
  details.tier-section > summary .chevron {
    display: inline-block;
    width: 9px; height: 9px;
    border-right: 2px solid var(--muted);
    border-bottom: 2px solid var(--muted);
    transform: rotate(-45deg);
    transition: transform 0.15s ease;
    flex-shrink: 0;
  }
  details[open].tier-section > summary .chevron { transform: rotate(45deg); }
  details.tier-section > summary .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  details.tier-section > summary .dot.good { background: var(--good); }
  details.tier-section > summary .dot.warn { background: var(--warn); }
  details.tier-section > summary .dot.muted { background: var(--muted); }
  details.tier-section > summary .dot.skip { background: var(--skip); }
  details.tier-section > summary .count {
    font-size: 12px;
    color: var(--muted);
    font-weight: 500;
    font-family: 'IBM Plex Mono', monospace;
  }
  details.tier-section > summary .dash {
    flex: 1;
    height: 1px;
    background: var(--line);
  }
  .posting-list { display: flex; flex-direction: column; gap: 8px; padding-bottom: 4px; }

  .posting {
    display: grid;
    grid-template-columns: auto 1fr auto auto;
    align-items: center;
    gap: 14px;
    padding: 13px 15px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-left: 3px solid var(--line);
    border-radius: 8px;
    box-shadow: var(--shadow);
    transition: box-shadow 0.12s ease, transform 0.12s ease;
  }
  .posting:hover { box-shadow: var(--shadow-hover); transform: translateY(-1px); }
  .posting.tone-good { border-left-color: var(--good); }
  .posting.tone-warn { border-left-color: var(--warn); }
  .posting.tone-muted { border-left-color: var(--muted); }
  .posting.tone-skip { border-left-color: var(--skip); }
  @media (max-width: 620px) {
    .posting { grid-template-columns: 1fr; }
    .posting .score-badge { justify-self: flex-start; }
  }
  .posting .score-badge {
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 600;
    font-size: 13px;
    width: 40px;
    height: 40px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .score-badge.good { background: var(--good-soft); color: var(--good); }
  .score-badge.warn { background: var(--warn-soft); color: var(--warn); }
  .score-badge.muted { background: var(--muted-soft); color: var(--muted); }
  .score-badge.skip { background: var(--skip-soft); color: var(--skip); }

  .posting .title { font-weight: 600; font-size: 14px; }
  .posting .sub { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
  .posting .sub .src { font-family: 'IBM Plex Mono', monospace; font-size: 11px; }

  .posting .status-chip {
    font-size: 11px;
    padding: 3px 9px;
    border-radius: 99px;
    background: var(--muted-soft);
    color: var(--muted);
    white-space: nowrap;
  }
  .posting a.view {
    font-size: 12.5px;
    color: var(--accent);
    text-decoration: none;
    white-space: nowrap;
    font-weight: 500;
  }
  .posting a.view:hover { text-decoration: underline; }

  .note-line {
    font-size: 12px;
    color: var(--muted);
    margin-top: 6px;
    padding-left: 14px;
    border-left: 2px solid var(--line);
  }

  .empty-tier, .no-match {
    font-size: 13px;
    color: var(--muted);
    padding: 14px;
    border: 1px dashed var(--line);
    border-radius: 8px;
    background: var(--surface-2);
  }

  .companies-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 10px;
  }
  .company-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-left: 3px solid var(--line);
    border-radius: 8px;
    padding: 12px 14px;
    box-shadow: var(--shadow);
    transition: box-shadow 0.12s ease, transform 0.12s ease;
  }
  .company-card:hover { box-shadow: var(--shadow-hover); transform: translateY(-1px); }
  .company-card.tone-good { border-left-color: var(--good); }
  .company-card.tone-warn { border-left-color: var(--warn); }
  .company-card.tone-muted { border-left-color: var(--muted); }
  .company-card.tone-skip { border-left-color: var(--skip); }
  .company-card .cc-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 8px;
    margin-bottom: 4px;
  }
  .company-card .cname { font-weight: 600; font-size: 13.5px; }
  .company-card .cmeta { font-size: 11.5px; color: var(--muted); }
  .company-card .view { display: inline-block; margin-top: 8px; }
  .status-chip.chip-good { background: var(--good-soft); color: var(--good); }
  .status-chip.chip-warn { background: var(--warn-soft); color: var(--warn); }
  .status-chip.chip-muted { background: var(--muted-soft); color: var(--muted); }
  .status-chip.chip-skip { background: var(--skip-soft); color: var(--skip); }

  footer {
    grid-column: 1 / -1;
    margin-top: 12px;
    padding-top: 14px;
    border-top: 1px solid var(--line);
    font-size: 11.5px;
    color: var(--muted);
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }

  a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 2px;
  }

  #load-error {
    grid-column: 1 / -1;
    background: var(--skip-soft);
    color: var(--skip);
    border: 1px solid var(--skip);
    border-radius: 8px;
    padding: 12px 14px;
    font-size: 13px;
  }
</style>

<div class="wrap" id="app">
  <header class="top">
    <div>
      <p class="name">Bijneshwor Shrestha</p>
      <h1>Job Search</h1>
    </div>
    <div class="meta" id="last-updated"></div>
  </header>
</div>

<script>
const TIER_DEFS = [
  { key: 'apply_high', label: 'Apply — high priority', cls: 'good', open: true },
  { key: 'apply', label: 'Apply', cls: 'good', open: true },
  { key: 'consider', label: 'Consider', cls: 'warn', open: true },
];
// Skip-tier postings (fail the score threshold or a hard constraint) are never sent to this
// dashboard at all — they're excluded at the data stage, not just hidden here.
const COMPANY_STATUS_DEFS = {
  target:   { label: 'Confirmed target', cls: 'good' },
  apply:    { label: 'Apply-tier match', cls: 'good' },
  consider: { label: 'Consider-tier match', cls: 'warn' },
  skipped:  { label: 'Skipped', cls: 'skip' },
  watching: { label: 'Watching', cls: 'muted' },
};

let ALL_POSTINGS = [];
let ALL_COMPANIES = [];
const state = { query: '', tierFilter: 'all', sort: 'score-desc', page: 'postings' };

function switchPage(page) {
  state.page = page;
  document.querySelectorAll('.nav-link').forEach(l => l.classList.toggle('active', l.dataset.nav === page));
  const postingsEls = document.querySelectorAll('[data-page="postings"]');
  const companiesEls = document.querySelectorAll('[data-page="companies"]');
  postingsEls.forEach(el => { el.style.display = page === 'postings' ? '' : 'none'; });
  companiesEls.forEach(el => { el.style.display = page === 'companies' ? '' : 'none'; });
}

async function render() {
  const wrap = document.getElementById('app');

  let data;
  try {
    const res = await fetch('data.json', { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    data = await res.json();
  } catch (err) {
    const box = document.createElement('div');
    box.id = 'load-error';
    box.textContent = 'Could not load data.json (' + err.message + '). This page only displays the data file published alongside it — nothing is stored here.';
    wrap.appendChild(box);
    return;
  }

  ALL_POSTINGS = data.postings || [];
  ALL_COMPANIES = data.companies_looked_at || [];

  document.getElementById('last-updated').textContent =
    'Updated ' + new Date(data.generated_at).toLocaleString('en-GB', { dateStyle: 'medium', timeStyle: 'short' });

  // ---- Stats bar ----
  const counts = { all: ALL_POSTINGS.length };
  TIER_DEFS.forEach(td => { counts[td.key] = ALL_POSTINGS.filter(p => p.tier === td.key).length; });

  const statsBar = document.createElement('div');
  statsBar.className = 'stats-bar';
  statsBar.dataset.page = 'postings';
  const statDefs = [
    { key: 'all', label: 'All postings', cls: 'accent' },
    { key: 'apply_high', label: 'Apply — high', cls: 'good' },
    { key: 'apply', label: 'Apply', cls: 'good' },
    { key: 'consider', label: 'Consider', cls: 'warn' },
  ];
  statDefs.forEach(sd => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'stat-tile c-' + sd.cls + (sd.key === 'all' ? ' active' : '');
    btn.dataset.tier = sd.key;
    btn.innerHTML = `<div class="n tabular">${counts[sd.key] || 0}</div><div class="l">${escapeHtml(sd.label)}</div>`;
    btn.addEventListener('click', () => {
      state.tierFilter = sd.key;
      document.querySelectorAll('.stat-tile').forEach(t => t.classList.toggle('active', t.dataset.tier === sd.key));
      applyFilters();
    });
    statsBar.appendChild(btn);
  });
  wrap.appendChild(statsBar);

  // ---- Controls ----
  const controls = document.createElement('div');
  controls.className = 'controls';
  controls.dataset.page = 'postings';
  controls.innerHTML = `
    <input type="search" id="search-box" placeholder="Search title or company…" aria-label="Search postings">
    <select id="sort-select" aria-label="Sort postings">
      <option value="score-desc">Score: high to low</option>
      <option value="score-asc">Score: low to high</option>
      <option value="company">Company A–Z</option>
      <option value="recent">Most recently found</option>
    </select>
    <span class="result-count" id="result-count"></span>
  `;
  wrap.appendChild(controls);

  // ---- Sidebar: navigation ----
  const aside = document.createElement('aside');

  const navPanel = document.createElement('div');
  navPanel.className = 'panel nav-panel';
  const navLinks = [
    { key: 'postings', label: 'Postings', count: ALL_POSTINGS.length },
    { key: 'companies', label: 'Companies looked at', count: ALL_COMPANIES.length },
  ];
  navLinks.forEach(nl => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'nav-link' + (nl.key === state.page ? ' active' : '');
    btn.dataset.nav = nl.key;
    btn.innerHTML = `<span>${escapeHtml(nl.label)}</span><span class="nav-count tabular">${nl.count}</span>`;
    btn.addEventListener('click', () => switchPage(nl.key));
    navPanel.appendChild(btn);
  });
  aside.appendChild(navPanel);

  // ---- Sidebar: CV tracks ----
  const tracksPanel = document.createElement('div');
  tracksPanel.className = 'panel';
  tracksPanel.innerHTML = '<h2>Search priority</h2>';
  data.cv_tracks
    .slice()
    .sort((a, b) => a.tier - b.tier)
    .forEach(t => {
      const row = document.createElement('div');
      row.className = 'track-row';
      row.innerHTML = `<span>${escapeHtml(t.name)}</span><span class="tier-pill t${t.tier}">TIER ${t.tier}</span>`;
      tracksPanel.appendChild(row);
    });
  aside.appendChild(tracksPanel);

  wrap.appendChild(aside);

  // ---- Main: postings by tier (skeleton built once, contents filtered/sorted separately) ----
  const main = document.createElement('main');
  TIER_DEFS.forEach(td => {
    const details = document.createElement('details');
    details.className = 'tier-section';
    details.dataset.tier = td.key;
    details.dataset.page = 'postings';
    if (td.open) details.open = true;
    details.innerHTML = `
      <summary>
        <span class="chevron"></span>
        <span class="dot ${td.cls}"></span>
        <span>${escapeHtml(td.label)}</span>
        <span class="count tabular" data-role="count"></span>
        <span class="dash"></span>
      </summary>
      <div class="posting-list" data-role="list"></div>
    `;
    main.appendChild(details);
  });

  // ---- Companies looked at (full-width, own section) ----
  const companiesSection = document.createElement('section');
  companiesSection.className = 'tier-section';
  companiesSection.dataset.page = 'companies';
  const companies = ALL_COMPANIES;
  companiesSection.innerHTML = `<h2 style="display:flex;align-items:center;gap:10px;font-size:15px;margin:0 0 10px;font-weight:600;">Companies looked at <span class="count tabular" style="font-size:12px;color:var(--muted);font-weight:500;">${companies.length}</span><span class="dash" style="flex:1;height:1px;background:var(--line);"></span></h2>`;
  const companiesGrid = document.createElement('div');
  companiesGrid.className = 'companies-grid';
  companies.forEach(c => {
    const sd = COMPANY_STATUS_DEFS[c.status] || { label: c.status, cls: 'muted' };
    const card = document.createElement('div');
    card.className = 'company-card tone-' + sd.cls;
    card.innerHTML = `
      <div class="cc-top">
        <div class="cname">${escapeHtml(c.company)}</div>
        <div class="status-chip chip-${sd.cls}">${escapeHtml(sd.label)}</div>
      </div>
      <div class="cmeta">${escapeHtml(c.industry)} · ${escapeHtml(c.region)}</div>
      ${c.note ? `<div class="note-line">${escapeHtml(c.note)}</div>` : ''}
      <a class="view" href="${escapeAttr(c.careers_url)}" target="_blank" rel="noreferrer">careers page →</a>
    `;
    companiesGrid.appendChild(card);
  });
  companiesSection.appendChild(companiesGrid);
  main.appendChild(companiesSection);

  wrap.appendChild(main);

  const footer = document.createElement('footer');
  footer.innerHTML = `
    <span>View-only — searches are run in a Claude conversation, not from this page.</span>
    <span>Data lives in <span class="mono">data.json</span>, committed to git manually.</span>
  `;
  wrap.appendChild(footer);

  // ---- Wire up controls ----
  document.getElementById('search-box').addEventListener('input', (e) => {
    state.query = e.target.value.trim().toLowerCase();
    applyFilters();
  });
  document.getElementById('sort-select').addEventListener('change', (e) => {
    state.sort = e.target.value;
    applyFilters();
  });

  applyFilters();
  switchPage(state.page);
}

function applyFilters() {
  const q = state.query;
  let visibleTotal = 0;

  TIER_DEFS.forEach(td => {
    const section = document.querySelector(`details.tier-section[data-tier="${td.key}"]`);
    if (!section) return;

    const matchesTierFilter = state.tierFilter === 'all' || state.tierFilter === td.key;
    section.style.display = matchesTierFilter ? '' : 'none';
    if (!matchesTierFilter) return;

    let items = ALL_POSTINGS.filter(p => p.tier === td.key);
    if (q) {
      items = items.filter(p =>
        (p.title || '').toLowerCase().includes(q) ||
        (p.company || '').toLowerCase().includes(q) ||
        (p.location || '').toLowerCase().includes(q)
      );
    }
    items = sortPostings(items, state.sort);
    visibleTotal += items.length;

    section.querySelector('[data-role="count"]').textContent = items.length;
    const list = section.querySelector('[data-role="list"]');
    list.innerHTML = '';

    if (items.length === 0) {
      const empty = document.createElement('div');
      empty.className = q ? 'no-match' : 'empty-tier';
      empty.textContent = q
        ? 'No postings in this tier match your search.'
        : (td.key === 'unverified' ? 'Nothing unverified right now.' : 'No results yet — run the next prioritized scan to populate this.');
      list.appendChild(empty);
      return;
    }

    items.forEach(p => {
      const row = document.createElement('div');
      const badgeCls = p.score == null ? 'muted' : (p.score >= 50 ? 'good' : (p.score >= 40 ? 'warn' : 'skip'));
      row.className = 'posting tone-' + badgeCls;
      row.innerHTML = `
        <div class="score-badge tabular ${badgeCls}">${p.score != null ? p.score : '—'}</div>
        <div>
          <div class="title">${escapeHtml(p.title)} · ${escapeHtml(p.company)}</div>
          <div class="sub">${escapeHtml(p.location)} <span class="src">· ${escapeHtml(p.source)}</span></div>
          ${p.score_note ? `<div class="note-line">${escapeHtml(p.score_note)}</div>` : ''}
        </div>
        <div class="status-chip">${escapeHtml(p.status)}</div>
        <a class="view" href="${escapeAttr(p.url)}" target="_blank" rel="noreferrer">View →</a>
      `;
      list.appendChild(row);
    });
  });

  const resultCount = document.getElementById('result-count');
  if (resultCount) {
    resultCount.textContent = q || state.tierFilter !== 'all'
      ? `${visibleTotal} of ${ALL_POSTINGS.length} shown`
      : `${ALL_POSTINGS.length} total`;
  }
}

function sortPostings(items, sort) {
  const copy = items.slice();
  switch (sort) {
    case 'score-asc':
      return copy.sort((a, b) => (a.score ?? -1) - (b.score ?? -1));
    case 'company':
      return copy.sort((a, b) => (a.company || '').localeCompare(b.company || ''));
    case 'recent':
      return copy.sort((a, b) => (b.found_at || '').localeCompare(a.found_at || ''));
    case 'score-desc':
    default:
      return copy.sort((a, b) => (b.score ?? -1) - (a.score ?? -1));
  }
}

function escapeHtml(s) {
  if (s == null) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeAttr(s) { return escapeHtml(s); }

render();
</script>
